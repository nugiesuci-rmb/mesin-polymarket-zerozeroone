name: Mesin harian

on:
  schedule:
    - cron: '30 0 * * *'      # tiap hari 00:30 UTC = 07:30 WIB
  workflow_dispatch:           # tombol "Run workflow" manual

permissions:
  contents: write

concurrency:
  group: mesin
  cancel-in-progress: false

jobs:
  jalan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang requests
        run: pip install requests

      - name: Jalankan mesin
        env:
          PM_BASE: data
        run: python engine.py

      - name: Siapkan halaman web
        run: |
          mkdir -p docs
          cp data/dashboard.html docs/index.html
          cp data/brief_untuk_claude.txt docs/brief.txt
          cp data/positions.json docs/positions.json

      - name: Simpan hasil
        run: |
          git config user.name "mesin-bot"
          git config user.email "mesin-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(date -u +%F-%H%M)"
          git push
